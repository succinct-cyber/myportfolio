databases:
  - name: yomi-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: yomi-fabiyi-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed && (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: yomi-db, property: connectionString }
      - { key: DJANGO_DEBUG, value: "0" }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: DJANGO_ALLOWED_HOSTS, value: yomiportfolio-api.onrender.com }
      - { key: CORS_ALLOWED_ORIGINS, value: "https://yomiportfolio.onrender.com" }
      - { key: CSRF_TRUSTED_ORIGINS, value: "https://yomiportfolio.onrender.com" }
      - { key: CONTACT_RECIPIENT, value: pharbeeyee16@gmail.com }
      - { key: DJANGO_SUPERUSER_USERNAME, sync: false }
      - { key: DJANGO_SUPERUSER_EMAIL, value: pharbeeyee16@gmail.com }
      - { key: DJANGO_SUPERUSER_PASSWORD, sync: false }

  - type: web
    name: yomi-fabiyi-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - { key: BACKEND_URL, value: "https://yomiportfolio-api.onrender.com" }
      - { key: NEXT_PUBLIC_API_URL, value: "https://yomiportfolio-api.onrender.com/api" }
      - { key: NEXT_PUBLIC_SITE_URL, value: "https://yomiportfolio.onrender.com" }