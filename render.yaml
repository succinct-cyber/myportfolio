databases:
  - name: yomi-db
    plan: free

services:
  - type: web
    name: yomi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: yomi-db, property: connectionString }
      - { key: DJANGO_DEBUG, value: "0" }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: DJANGO_ALLOWED_HOSTS, value: yomi-api.onrender.com }
      - { key: CORS_ALLOWED_ORIGINS, value: "https://yomi-web.onrender.com" }
      - { key: CSRF_TRUSTED_ORIGINS, value: "https://yomi-web.onrender.com" }
      - { key: CONTACT_RECIPIENT, value: pharbeeyee16@gmail.com }

  - type: web
    name: yomi-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - { key: BACKEND_URL, value: "https://yomi-api.onrender.com" }
      - { key: NEXT_PUBLIC_API_URL, value: "https://yomi-api.onrender.com/api" }
      - { key: NEXT_PUBLIC_SITE_URL, value: "https://yomi-web.onrender.com" }
